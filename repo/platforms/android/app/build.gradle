plugins { id 'com.android.application' }
def appManifest = new groovy.json.JsonSlurper().parse(file('../../../src/manifest.json'))
android {
    namespace 'com.wordbook.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.wordbook.offline'
        minSdk 24
        targetSdk 35
        versionCode appManifest.versionCode.toInteger()
        versionName appManifest.versionName
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    sourceSets.main.assets.srcDirs = ['../../../../dist/.cache/android-assets']
}
tasks.register('checkWebAssets') {
    doLast {
        if (!file('../../../../dist/.cache/android-assets/www/index.html').exists()) {
            throw new GradleException('Run pnpm package:android from repo/ first.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkWebAssets' }
