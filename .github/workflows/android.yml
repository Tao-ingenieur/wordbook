name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wordbook-debug-signing-v1
      - name: Restore persistent signing identity
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          node --input-type=module -e "import fs from 'node:fs';import os from 'node:os';import path from 'node:path';const p=path.join(os.homedir(),'.android/debug.keystore');if(process.env.ANDROID_SIGNING_KEYSTORE){fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,Buffer.from(process.env.ANDROID_SIGNING_KEYSTORE,'base64'),{mode:0o600});}if(!fs.existsSync(p))throw Error('Existing signing key missing. Restore it before building an update.');"
      - name: Download upgrade baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/android-baseline.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm package:android
      - name: Seal signing identity for persistent storage
        run: |
          python3 -m pip install PyNaCl==1.5.0
          python3 scripts/seal-android-signing.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 repo/scripts/smoke-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordbook-android
          path: dist/android/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordbook-android-checks
          path: dist/reports/android/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wordbook-signing-recovery
          path: dist/.cache/signing-recovery/signing-secret.json
          if-no-files-found: error
